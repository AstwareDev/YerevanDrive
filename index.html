<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yerevan Drift — Republic Square map</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0710; overflow: hidden; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #cfd3e6; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: 14px; padding: 10px 12px; background: rgba(8,6,16,.62); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; backdrop-filter: blur(6px); pointer-events: none; }
  #hud.hidden { display: none; }
  #hud b { color: #ff7ac8; letter-spacing: .08em; }
  #hud .k { color: #7fe3ff; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0710; transition: opacity .8s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loadbox { width: 320px; text-align: center; }
  #loadbar { height: 3px; width: 0; background: linear-gradient(90deg,#ff3fa6,#42d9ff); transition: width .2s; margin-top: 10px; }
  .attr { position: fixed; right: 10px; bottom: 6px; font-size: 10px; opacity: .55; }
</style>
</head>
<body>
<div id="hud">
  <b>YEREVAN · REPUBLIC SQUARE</b> &nbsp; <span id="mode">ORBIT</span> · <span id="fps"></span><br />
  <span id="stats"></span><br />
  <span class="k">1</span> orbit &nbsp;<span class="k">2</span> fly (drag, WASD, Q/E, Shift, wheel) &nbsp;<span class="k">3</span> drive tour &nbsp;<span class="k">N</span> next road<br />
  <span class="k">T</span> day/night &nbsp;<span class="k">R</span> wet/dry &nbsp;<span class="k">B</span> bloom &nbsp;<span class="k">H</span> hide this
</div>
<div id="loading"><div id="loadbox"><div id="loadtxt">Loading…</div><div style="height:3px;background:#1d1830;margin-top:10px"><div id="loadbar"></div></div></div></div>
<div class="attr">Map data © OpenStreetMap contributors (ODbL) · Elevation: Mapzen/AWS Terrain Tiles</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
