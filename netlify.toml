# Netlify: static site (Vite build). Multiplayer is serverless WebRTC (Trystero) so no functions / websockets are needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# hashed bundles never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# baked map data: not hashed, so let browsers keep it for a day and then revalidate
[[headers]]
  for = "/tiles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/map/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/tex/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/car/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
